[project]
name = "yt-download"
version = "0.1.0"
description = "A simple dark desktop app for downloading YouTube videos."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "imageio-ffmpeg>=0.5",
    "PySide6>=6.7",
    "yt-dlp>=2025.1.15",
]

[project.scripts]
yt-download = "yt_downloader.__main__:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_downloader"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
