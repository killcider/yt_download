name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows-installer:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python
        run: uv python install 3.12

      - name: Install Inno Setup
        shell: powershell
        run: |
          winget install --id JRSoftware.InnoSetup --exact --silent --accept-package-agreements --accept-source-agreements
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build installer
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/build-windows-installer.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: YT-Download-Setup
          path: dist/installer/YT-Download-Setup.exe
